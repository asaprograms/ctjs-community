name: build

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    name: Build
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew --no-daemon build -Pfull

      - name: Get Short SHA
        id: sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Flatten Output Directory
        run: |
          mkdir temp-dir
          cp build/libs/* temp-dir
#          cp build/generated/ksp/main/resources/* temp-dir

      - name: Publish Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ChatTriggers-artifacts-${{ steps.sha.outputs.sha_short }}
          path: temp-dir

  client-smoke:
    name: Client startup smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Start Minecraft and load the compatibility fixture
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set +e
          timeout 180s xvfb-run -a ./gradlew --no-daemon runClient > client-smoke.log 2>&1
          status=$?
          set -e
          cat client-smoke.log
          grep -Fq 'CTJS_LEGACY_SMOKE_LOADED' client-smoke.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

      - name: Publish client log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-smoke-${{ github.sha }}
          path: client-smoke.log
